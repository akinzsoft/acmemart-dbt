name: 'acmemart'
version: '1.0.0'
config-version: 2

profile: 'acmemart'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  acmemart:
    staging:
      +materialized: view
      +schema: staging
    gold:
      +materialized: table
      +schema: gold
    aggregates:
      +materialized: table
      +schema: aggregates
